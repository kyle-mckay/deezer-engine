playlists:
    # --- VALIDATION OVERRIDE AND FAIL TEST ---
  - name: "override_and_fail"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 17 # # Intentional mismatch to trigger warn validation failure
    destination:
      - type: "file"
        name: "./pytest/input_output/override-and-fail.json"
        i: 10
        validation_mode: "fail" # Intentional failure, actual expected input is 18

  # --- LIMIT MODIFIER TESTS --- 
  - name: "limit_positive"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
    modifiers:
      - type: "limit"
        order: "top"
        count: 10
        i: 18
        o: 10
    destination:
      - type: "file"
        name: "./pytest/input_output/limit-positive.json"
        i: 10
  - name: "limit_large"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
    modifiers:
      - type: "limit"
        order: "top"
        count: 100
        i: 18
        o: 18
    destination:
      - type: "file"
        name: "./pytest/input_output/limit-large.json"
        i: 18
  - name: "limit_zero"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
    modifiers:
      - type: "limit"
        order: "top"
        count: 0
        i: 18
        o: 0
    destination:
      - type: "file"
        name: "./pytest/input_output/limit-zero.json"
        i: 0

  # --- FILTER MODIFIER TESTS --- 
  - name: "filter_id_positive"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "76585.json"
        o: 2
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "384514987.json"
        o: 12
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "536294.json"
        o: 12
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "84698.json"
        o: 11
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "102809.json"
        o: 13
    modifiers:
      - type: "filter"
        field: "id"
        operator: "gt"
        value: 10000000
        i: 68
        o: 12
    destination:
      - type: "file"
        name: "./pytest/input_output/filter-id-positive.json"
        i: 12
  - name: "filter_title_contains"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
    modifiers:
      - type: "filter"
        field: "title"
        operator: "contains"
        value: "The"
        i: 18
        o: 3
    destination:
      - type: "file"
        name: "./pytest/input_output/filter-title-contains.json"
        i: 3
  - name: "filter_empty"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
    modifiers:
      - type: "filter"
        field: "id"
        operator: "lt"
        value: 100000
        i: 18
        o: 0
    destination:
      - type: "file"
        name: "./pytest/input_output/filter-empty.json"
        i: 0

  # --- EXCLUDE MODIFIER TESTS --- 
  - name: "exclude_positive"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "76585.json"
        o: 2
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "384514987.json"
        o: 12
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "536294.json"
        o: 12
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "84698.json"
        o: 11
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
      - type: "file"
        dir: "./tests/fixtures/album"
        filename: "102809.json"
        o: 13
    modifiers:
      - type: "exclude"
        source:
          - type: "file"
            dir: "./app/tests/fixtures/album"
            filename: "91258.json"
        i: 68
        o: 50
    destination:
      - type: "file"
        name: "./pytest/input_output/exclude-positive.json"
        i: 50

  # --- DEDUPE, SHUFFLE, SORT TESTS --- 
  - name: "dedupe_no_op"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "102809.json"
        o: 13
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "536294.json"
        o: 12
    modifiers:
      - type: "dedupe"
        i: 25
        o: 25
    destination:
      - type: "file"
        name: "./pytest/input_output/dedupe-no-op.json"
        i: 25
  - name: "sort_by_id"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
    modifiers:
      - type: "sort"
        field: "id"
        order: "asc"
        i: 18
        o: 18
    destination:
      - type: "file"
        name: "./pytest/input_output/sort-by-id.json"
        i: 18

  # --- CHAINED AND NESTED MODIFIERS --- 
  - name: "chain_filter_limit"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "76585.json"
        o: 2
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "384514987.json"
        o: 12
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "536294.json"
        o: 12
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "84698.json"
        o: 11
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "102809.json"
        o: 13
    modifiers:
      - type: "filter"
        field: "id"
        operator: "gt"
        value: 1000000
        i: 68
        o: 24
      - type: "limit"
        count: 10
        i: 24
        o: 10
    destination:
      - type: "file"
        name: "./pytest/input_output/chain-filter-limit.json"
        i: 10
  - name: "nested_local_modifier"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
        modifiers:
          - type: "limit"
            count: 5
            i: 18
            o: 5
      - type: "file"
        dir: "./tests/fixtures/album"
        filename: "76585.json"
        o: 2
    destination:
      - type: "file"
        name: "./pytest/input_output/nested-local-modifier.json"
        i: 7

  - name: "grouped_source_output_total"
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: ["76585.json", "102809.json"]
        o: 15
    destination:
      - type: "file"
        name: "./pytest/input_output/grouped-source-output-total.json"
        i: 15

  # --- INTERLEAVE MODIFIER TESTS ---
  - name: "interleave_basic"
    # Origin: 91258 (18 tracks). Inject: 76585 (2 tracks) every 3, add 1.
    # Injects at counts 3 and 6; source exhausted. Origin continues (continue_on_exhaust: true).
    # Result: 18 + 2 = 20.
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
    modifiers:
      - type: "interleave"
        continue_on_exhaust: true
        i: 18
        o: 20
        inject:
          - source:
              type: "file"
              dir: "./app/tests/fixtures/album"
              filename: "76585.json"
            every: 3
            add: 1
    destination:
      - type: "file"
        name: "./pytest/input_output/interleave-basic.json"
        i: 20

  - name: "interleave_origin_exhausts"
    # Origin: 76585 (2 tracks). Inject: 102809 (13 tracks) every 1, add 1.
    # Injects w1 after o1, w2 after o2. Origin done; 11 remainder appended (continue_on_exhaust: true).
    # Result: 2 + 2 + 11 = 15.
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "76585.json"
        o: 2
    modifiers:
      - type: "interleave"
        continue_on_exhaust: true
        i: 2
        o: 15
        inject:
          - source:
              type: "file"
              dir: "./app/tests/fixtures/album"
              filename: "102809.json"
            every: 1
            add: 1
    destination:
      - type: "file"
        name: "./pytest/input_output/interleave-origin-exhausts.json"
        i: 15

  - name: "interleave_continue_off"
    # Same sources as above but top-level continue_on_exhaust: false.
    # Remainder is discarded when origin runs out. Result: 2 + 2 = 4.
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "76585.json"
        o: 2
    modifiers:
      - type: "interleave"
        continue_on_exhaust: false
        i: 2
        o: 4
        inject:
          - source:
              type: "file"
              dir: "./app/tests/fixtures/album"
              filename: "102809.json"
            every: 1
            add: 1
    destination:
      - type: "file"
        name: "./pytest/input_output/interleave-continue-off.json"
        i: 4

  - name: "interleave_local_modifier"
    # Interleave used as a local (child) modifier on the first source block.
    # Source 1: 91258 (18) + inject 76585 (2) every 3/add 1 → 20 tracks.
    # Source 2: 536294 (12). Global pipeline: 20 + 12 = 32.
    source:
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "91258.json"
        o: 18
        modifiers:
          - type: "interleave"
            continue_on_exhaust: true
            i: 18
            o: 20
            inject:
              - source:
                  type: "file"
                  dir: "./app/tests/fixtures/album"
                  filename: "76585.json"
                every: 3
                add: 1
      - type: "file"
        dir: "./app/tests/fixtures/album"
        filename: "536294.json"
        o: 12
    destination:
      - type: "file"
        name: "./pytest/input_output/interleave-local-modifier.json"
        i: 32

  - name: "chain_sort_limit_filter_duration"
    source:
      - type: "file"
        dir: "./tests/fixtures/album"
        filename: "91258.json"
        o: 18
    modifiers:
      - type: "sort"
        field: "id"
        order: "asc"
        i: 18
        o: 18
      - type: "limit"
        count: 10
        i: 18
        o: 10
      - type: "filter"
        field: "duration"
        operator: "gt"
        value: 150
        i: 10
        o: 6
    destination:
      - type: "file"
        name: "./pytest/input_output/chain-sort-limit-filter-duration.json"
        i: 6