# Comprehensive startup examples.
# For a minimal first-run file, use app/strategies.yml.template.
# Full source, modifier, and destination reference: https://codeberg.org/kylemmkay/deezer-engine/wiki/Strategy-Configuration
playlists:
  - name: "Taylor Swift: The Timeline"
    source:
      - type: "artist"
        id: "12246" # Taylor Swift
    modifiers:
      - type: "sort"
        field: "release_date"
        order: "asc"
    destination:
      - type: "playlist"
        id: "REPLACE_WITH_YOUR_ID"
        order: "replace"

  - name: "High-Rank Discovery"
    source:
      - type: "smarttracklist"
        name: "discovery"
        modifiers:
          - type: "filter"
            field: "rank"
            operator: "gt"
            value: 500000 # Keep very popular tracks only
      - type: "smarttracklist"
        name: "inspired-by-1"
      - type: "smarttracklist"
        name: "inspired-by-2"
      - type: "smarttracklist"
        name: "inspired-by-3"
    modifiers:
      - type: "exclude"
        source:
          - type: "history"
            lookback: 7
      - type: "dedupe"
      - type: "shuffle"
        order: "smart"
    destination:
      - type: "playlist"
        id: "REPLACE_WITH_YOUR_ID"
        order: "replace"

  - name: "Unseen Global Hits"
    source:
      - type: "playlist"
        id: "10064140302" # Top 50 Global
    modifiers:
      - type: "exclude"
        source:
          - type: "favorites"
      - type: "sort"
        field: "rank"
        order: "desc"
      - type: "limit"
        count: 20
        order: "top"
    destination:
      - type: "playlist"
        id: "REPLACE_WITH_YOUR_ID"
        order: "replace"

  - name: "Fresh Favorites"
    source:
      - type: "album"
        id: "897621962" # Britpop by Robbie Williams
      - type: "favorites"
    modifiers:
      - type: "exclude"
        source:
          - type: "playlist"
            id: "1363560485" # Deezer Hits
      - type: "shuffle"
        order: "random"
    destination:
      - type: "playlist"
        id: "REPLACE_WITH_YOUR_ID"
        order: "replace"

  - name: "Fast-Paced House"
    source:
      - type: "playlist"
        id: "10064138682" # Top 50 USA as a base
    modifiers:
      - type: "filter"
        field: "duration"
        operator: "lt"
        value: 180 # Under 3 minutes
      - type: "limit"
        count: 30
        order: "first"
    destination:
      - type: "playlist"
        id: "REPLACE_WITH_YOUR_ID"
        order: "replace"

  - name: "Multi-Source IDs In One Block"
    source:
      - type: "album"
        id: ["91258", "897621962"]
      - type: "playlist"
        id: ["10064140302", "10064138682"]
      - type: "track"
        id: ["1008610492", "1008610493"]
      - type: "smarttracklist"
        name: ["discovery", "new-releases"]
    modifiers:
      - type: "dedupe"
      - type: "shuffle"
        order: "smart"
    destination:
      - type: "playlist"
        id: "REPLACE_WITH_YOUR_ID"
        order: "replace"

  - name: "Specific Track IDs"
    source:
      - type: "track"
        id: "1008610492"
    destination:
      - type: "playlist"
        id: "REPLACE_WITH_YOUR_ID"
        order: "replace"

  # Interleave: merge two libraries so they alternate every 2 songs.
  # continue_on_exhaust defaults to true (from config/env), so whichever
  # library runs out first has its remaining tracks appended at the end.
  - name: "Family Mix"
    source:
      - type: "favorites"
    modifiers:
      - type: "interleave"
        inject:
          - source:
              type: "playlist"
              id: "REPLACE_WITH_PARTNER_PLAYLIST_ID"
            every: 2   # after every 2 of your tracks...
            add: 1     # ...insert 1 from the partner playlist
      - type: "dedupe"
      - type: "shuffle"
        order: "random"
    destination:
      - type: "playlist"
        id: "REPLACE_WITH_YOUR_ID"
        order: "replace"

  # Interleave: used as a local modifier to weave a second source into
  # one specific source block before it merges with the global pipeline.
  # continue_on_exhaust: false here means partial inject batches are
  # dropped rather than appended, overriding the global config default.
  - name: "Discovery + Favourites Weave"
    source:
      - type: "smarttracklist"
        name: "discovery"
        modifiers:
          - type: "interleave"
            continue_on_exhaust: false
            inject:
              - source:
                  type: "favorites"
                every: 3   # after every 3 discovery tracks...
                add: 1     # ...insert 1 favourite
      - type: "smarttracklist"
        name: "inspired-by-1"
    modifiers:
      - type: "dedupe"
      - type: "limit"
        count: 80
        order: "top"
    destination:
      - type: "playlist"
        id: "REPLACE_WITH_YOUR_ID"
        order: "replace"

  - name: "Favorites Back-up"
    source:
      - type: "favorites"
    destination:
      - type: "file"
        dir: "./exports"
        name: "favorites-backup_{date}.json"
        retention: 168
