name: Release Drafter

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.github/**'
      - '.wiki/**'
      - '__version__.py'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    # Skip if actor is the bot
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check commit message for skip flag
        id: skip_check
        run: |
          if git log -1 --pretty=%B | grep -q '\[skip release\]'; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if skip flag set
        if: steps.skip_check.outputs.skip == 'true'
        run: |
          echo "Skipping release drafter due to skip flag."
          exit 0

      - name: Run Release Drafter
        if: steps.skip_check.outputs.skip != 'true'
        id: drafter
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout with PAT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PAT }}
          
      - name: Update and Push version
        run: |
          NEW_TAG="${{ steps.drafter.outputs.tag_name }}"
          
          # Update version number
          sed -i "s/^__version__ = .*/__version__ = \"$NEW_TAG\"/" __version__.py

          if git diff --exit-code __version__.py; then
            echo "No changes to __version__.py. Version is already up to date."
            exit 0
          fi
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add __version__.py
          git commit -m "chore: bump version to $NEW_TAG [skip ci]"
          git push origin main
