name: Build, Test, and Push Docker Image

on:
  release:
    types: [published]
  pull_request:
    paths:
      - '.forgejo/workflows/docker-publish.yml'
      - '**'
    paths-ignore:
      - 'app/deezer_engine/__version__.py'
      - 'CHANGELOG.md'
      - '.forgejo/**'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Manual tag name'
        default: 'latest'
        type: string

jobs:
  test_and_push:
    name: Build, Test, and Push
    runs-on: py-runner

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          set-safe-directory: 'true'

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            codeberg.org/${{ github.repository }}
            kylemmkay/deezer-engine
          tags: |
            # Release-only tags
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            
            # Manual/Development tags
            type=sha,prefix=beta-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=beta,enable=${{ github.event_name == 'workflow_dispatch' }}
            
            # Pull Request tags (internal only)
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Python dependencies (source)
        run: |
          pip install --no-cache-dir -r requirements.txt
        shell: bash

      - name: Run Pytest in Source
        run: |
          echo "Running pytest in source..."
          export TEST_MARKERS="not offline"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ./scripts/test.sh -s | tee pytest-source.log
          else
            ./scripts/test.sh | tee pytest-source.log
          fi
        shell: bash

      - name: Check Pytest Source Output
        run: |
          echo "Checking pytest source output for failure and pass indicators..."
          if grep -qE "=+ [0-9]+ failed" pytest-source.log; then
            echo "❌ Pytest source run failed!"
            exit 1
          elif ! grep -qE "=+ [0-9]+ passed" pytest-source.log; then
            echo "❌ Pytest source run did not report any passed tests!"
            exit 1
          else
            echo "✅ Pytest source run passed."
          fi
        shell: bash

      # Build the image locally
      - name: Build local image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: deezer-engine:test

      - name: Run Pytest in Container
        run: |
          echo "Running pytest inside the built Docker image..."
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            docker run --rm deezer-engine:test pytest -v --tb=short -m "unit or offline" app/tests | tee pytest-container.log
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            docker run --rm deezer-engine:test pytest -v -s --tb=short -m "not network" app/tests | tee pytest-container.log
          else
            docker run --rm deezer-engine:test pytest -v --tb=short -m "not network" app/tests | tee pytest-container.log
          fi
        shell: bash

      - name: Check Pytest Container Output
        run: |
          echo "Checking pytest container output for failure and pass indicators..."
          if grep -qE "=+ [0-9]+ failed" pytest-container.log; then
            echo "❌ Pytest container run failed!"
            exit 1
          elif ! grep -qE "=+ [0-9]+ passed" pytest-container.log; then
            echo "❌ Pytest container run did not report any passed tests!"
            exit 1
          else
            echo "✅ Pytest container run passed."
          fi
        shell: bash

      # 3. Log in (proceed if not PR)
      - name: Log in to Registries
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.REPO_PAT }}" | docker login codeberg.org -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Get Repo Description from Codeberg
        if: |
          github.event_name == 'release' && 
          github.event.release.target_commitish == 'main'
        id: repo_data
        run: |
          DESC=$(curl -s "https://codeberg.org/api/v1/repos/${{ github.repository }}" | jq -r '.description')
          echo "description=$DESC" >> $GITHUB_OUTPUT

      - name: Update Docker Hub Description
        if: |
          github.event_name == 'release' && 
          github.event.release.target_commitish == 'main'
        uses: https://github.com/peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository }}
          short-description: ${{ steps.repo_data.outputs.description }}
          readme-filepath: ./README.md