name: Draft and Publish New Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.forgejo/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  draft-release:
    # Get triggered by actions
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release-draft]')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: py-runner
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PAT }}

      - name: Validate Release Version
        id: validator
        run: |
          # extract drafted version
          
          NEW_TAG=$(grep "__version__ =" app/deezer_engine/__version__.py | cut -d '"' -f 2)
          echo "final_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Prepare Release Body
        id: body
        run: |
          # use changelog to populate release body if available
          if [ -f "./CHANGELOG.md" ]; then
            echo "--- Snip of Changelog ---"
            head -n 10 ./CHANGELOG.md
            echo "----------------------------"
            echo "content<<EOF" >> $GITHUB_OUTPUT
            chmod +x .forgejo/update-changelog.sh
            .forgejo/update-changelog.sh "changelog" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=Automated release for ${{ steps.git_push.outputs.final_tag }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Cleanup Old Drafts
        env:
          TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          echo ">>> Fetching releases..."
          # Get all releases and filter for IDs where draft is true
          DRAFT_IDS=$(curl -s -H "Authorization: token $TOKEN" \
            "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases" \
            | jq -r '.[] | select(.draft == true) | .id')

          if [ -z "$DRAFT_IDS" ]; then
            echo ">>> No drafts found to delete."
          else
          for ID in $DRAFT_IDS; do
              echo ">>> Deleting old draft ID: $ID"
            curl -s -X DELETE -H "Authorization: token $TOKEN" \
              "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases/$ID"
          done
          fi

      - name: Create Draft Release
        uses: https://gitea.com/actions/gitea-release-action@main
        if: ${{ github.ref_name == 'main' }}
        with:
          base_url: https://codeberg.org
          token: ${{ secrets.REPO_PAT }}
          tag_name: ${{ steps.validator.outputs.final_tag }}
          name: "Release ${{ steps.validator.outputs.final_tag }}"
          draft: true
          target_commitish: ${{ github.head_ref || github.ref_name }}
          body: ${{ steps.body.outputs.content }}