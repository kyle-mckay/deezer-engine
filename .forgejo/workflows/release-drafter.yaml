name: Release Engine

on:
  push:
    branches: [main]
    paths-ignore:
      - '__version__.py'
      - 'CHANGELOG.md'
      - '.forgejo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  draft-release:
    # Don't trigger yourself
    if: "!endsWith(github.event.head_commit.message, '[release-draft]')"
    runs-on: docker
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Release Version
        env:
          RAW_LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') || 'none' }}"
        run: |
          # extract current version
          LATEST_RELEASE_TAG=$(curl -s -H "Authorization: token ${{ secrets.REPO_PAT }}" \
            "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases?draft=false&pre-release=false" \
            | grep -oE '"tag_name":"[^"]+"' | head -1 | cut -d'"' -f4)

          CURRENT_TAG=${LATEST_RELEASE_TAG:-"v0.0.0"}
          
          # run release drafter script
          bash .forgejo/release-drafter.sh -m "${{ github.event.head_commit.message }}" -t "$CURRENT_TAG" -a "${{ github.actor }}" -l "$RAW_LABELS"
          
          NEW_TAG=$(grep "__version__ =" __version__.py | cut -d '"' -f 2)
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Update and Commit Version
        id: git_push
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.codeberg.org"
          git add __version__.py CHANGELOG.md
  
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $NEW_TAG [release-draft]"
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              git push origin main
            else
              git push --dry-run
            fi
          fi
          
          # save version for release creation step
          echo "final_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Prepare Release Body
        id: body
        run: |
          # use header.tmp to populate release body if available
          if [ -f "./header.tmp" ]; then
            echo "--- Release Body Content ---"
            cat ./header.tmp
            echo "----------------------------"
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat ./header.tmp >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=Automated release for ${{ steps.git_push.outputs.final_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Draft Release
        uses: https://gitea.com/actions/gitea-release-action@main
        if: ${{ github.ref_name == 'main' }}
        with:
          base_url: https://codeberg.org
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.git_push.outputs.final_tag }}
          name: "Release ${{ steps.git_push.outputs.final_tag }}"
          draft: true
          body: ${{ steps.body.outputs.content }}