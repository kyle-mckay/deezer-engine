name: Release Engine

on:
  push:
    branches:
      - main
    paths-ignore:
      - '__version__.py'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  draft-release:
    runs-on: docker
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Release Drafter
        run: |
          # extract current version
          CURRENT_TAG=$(grep "__version__ =" __version__.py | cut -d '"' -f 2)
          
          # extract metadata from commit
          MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.actor }}"
          PR_NUMBER=$(echo "$MSG" | grep -oE '#[0-9]+' | head -1 | sed 's/#//' || echo "0")
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          
          # run release-drafter script
          bash .forgejo/release-drafter.sh -m "$MSG" -t "$CURRENT_TAG" -p "$PR_NUMBER" -a "$AUTHOR" -l "$LABELS"

      - name: Commit and Push Changes
        id: git_push
        run: |
          # read updated version from file
          NEW_TAG=$(grep "__version__ =" __version__.py | cut -d '"' -f 2)
          
          git config user.name "codeberg-actions[bot]"
          git config user.email "actions@noreply.codeberg.org"
          
          git add __version__.py CHANGELOG.md
          git commit -m "chore: release $NEW_TAG [skip ci]"
          git push origin main
          
          # save version for release creation step
          echo "final_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Prepare Release Body
        id: body
        run: |
          # use header.tmp to populate release body if available
          if [ -f "./header.tmp" ]; then
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat ./header.tmp >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=Automated release for ${{ steps.git_push.outputs.final_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Draft Release
        uses: https://gitea.com/actions/gitea-release-action@main
        with:
          base_url: https://codeberg.org
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.git_push.outputs.final_tag }}
          name: "Release ${{ steps.git_push.outputs.final_tag }}"
          draft: true
          body: ${{ steps.body.outputs.content }}