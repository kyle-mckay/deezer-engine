name: Release Engine

on:
  push:
    branches: [main]
    paths-ignore:
      - '__version__.py'
      - 'CHANGELOG.md'
      - '.forgejo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  draft-release:
    # Don't trigger yourself
    if: "!endsWith(github.event.head_commit.message, '[release-draft]')"
    runs-on: docker
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Release Version
        env:
          RAW_LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') || 'none' }}"
          COMMIT_MSG: "${{ github.event.pull_request.title || github.event.head_commit.message || github.event.commits[0].message }}"
          PR_NUM: "${{ github.event.pull_request.number || '0' }}"
          AUTHOR_NAME: "${{ github.actor }}"
        run: |
          # extract current version
          LATEST_RELEASE_TAG=$(curl -s -H "Authorization: token ${{ secrets.REPO_PAT }}" \
            "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases?draft=false&pre-release=false" \
            | grep -oE '"tag_name":"[^"]+"' | head -1 | cut -d'"' -f4)

          # Preview current commit details
          echo "Git Log: $(git log -1)"

          if [[ -z "$COMMIT_MSG" ]]; then
            echo ">>> No commit message found. Fetching message via git log."
            COMMIT_MSG=$(git log -1 --pretty=%B)
          fi
          if [[ -z "$AUTHOR_NAME" || "$AUTHOR_NAME" == "***" ]]; then
            echo ">>> No author found. Fetching author via git log."
            AUTHOR=$(git log -1 --pretty=%an)
          else
            AUTHOR="$AUTHOR_NAME"
          fi
          if [[ -z "$RAW_LABELS" || "$RAW_LABELS" == "none" ]]; then
            echo ">>> No labels found. Setting labels to 'none'."
            RAW_LABELS="none"
          fi
          CURRENT_TAG=${LATEST_RELEASE_TAG:-"v0.0.0"}


          echo "Current Tag: $CURRENT_TAG"
          echo "Message: $COMMIT_MSG"
          echo "Author: $AUTHOR"
          echo "Labels: $RAW_LABELS"
          echo "PR Number: $PR_NUM"

          # run release drafter script
          bash .forgejo/release-drafter.sh -m "$COMMIT_MSG" -t "$CURRENT_TAG" -a "$AUTHOR" -l "$RAW_LABELS" -p "$PR_NUM"
          
          NEW_TAG=$(grep "__version__ =" __version__.py | cut -d '"' -f 2)
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Update and Commit Version
        id: git_push
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.codeberg.org"
          git add __version__.py CHANGELOG.md
  
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $NEW_TAG [release-draft]"
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              git push origin main
            else
              echo "Dry run push:"
              git push --dry-run origin HEAD:${{ github.head_ref }}
            fi
          fi
          
          # save version for release creation step
          echo "final_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Prepare Release Body
        id: body
        run: |
          # use header.tmp to populate release body if available
          if [ -f "./header.tmp" ]; then
            echo "--- Release Body Content ---"
            cat ./header.tmp
            echo "----------------------------"
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat ./header.tmp >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=Automated release for ${{ steps.git_push.outputs.final_tag }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Cleanup Old Drafts
        env:
          TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          apt-get update
          apt-get install -y jq

          echo ">>> Fetching releases..."
          # Get all releases and filter for IDs where draft is true
          DRAFT_IDS=$(curl -s -H "Authorization: token $TOKEN" \
            "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases" \
            | jq -r '.[] | select(.draft == true) | .id')

          if [ -z "$DRAFT_IDS" ]; then
            echo ">>> No drafts found to delete."
          else
            for ID in $DRAFT_IDS; do
              echo ">>> Deleting old draft ID: $ID"
              curl -s -X DELETE -H "Authorization: token $TOKEN" \
                "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases/$ID"
            done
          fi

      - name: Create Draft Release
        uses: https://gitea.com/actions/gitea-release-action@main
        if: ${{ github.ref_name == 'main' }}
        with:
          base_url: https://codeberg.org
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.git_push.outputs.final_tag }}
          name: "Release ${{ steps.git_push.outputs.final_tag }}"
          draft: true
          body: ${{ steps.body.outputs.content }}