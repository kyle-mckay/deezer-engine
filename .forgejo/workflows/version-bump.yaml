name: Determine Version and Update Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - '__version__.py'
      - 'CHANGELOG.md'
      - '.forgejo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  draft-release:
    # Don't trigger yourself
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[release-draft]')) ||
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '[release-draft]'))
    runs-on: docker
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Release Version
        id: validator
        env:
          RAW_LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') || 'none' }}"
          COMMIT_MSG: "${{ github.event.pull_request.title || github.event.head_commit.message || github.event.commits[0].message }}"
          PR_NUM: "${{ github.event.pull_request.number || '0' }}"
          AUTHOR_NAME: "${{ github.actor }}"
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          # extract current version
          LATEST_RELEASE_TAG=$(curl -s -H "Authorization: token $REPO_PAT" \
            "https://codeberg.org/api/v1/repos/${{ github.repository }}/releases?draft=false&pre-release=false" \
            | grep -oE '"tag_name":"[^"]+"' | head -1 | cut -d'"' -f4)

          # Preview current commit details
          echo "Git Log: $(git log -1)"

          if [[ -z "$COMMIT_MSG" ]]; then
            echo ">>> No commit message found. Fetching message via git log."
            COMMIT_MSG=$(git log -1 --pretty=%B)
          fi
          if [[ -z "$AUTHOR_NAME" || "$AUTHOR_NAME" == "***" ]]; then
            echo ">>> No author found. Fetching author via git log."
            AUTHOR=$(git log -1 --pretty=%an)
          else
            AUTHOR="$AUTHOR_NAME"
          fi
          if [[ -z "$RAW_LABELS" || "$RAW_LABELS" == "none" ]]; then
            echo ">>> No labels found. Setting labels to 'none'."
            RAW_LABELS="none"
          fi
          CURRENT_TAG=${LATEST_RELEASE_TAG:-"v0.0.0"}

          
          echo "Current Tag: $CURRENT_TAG"
          echo "Message: $COMMIT_MSG"
          echo "Author: $AUTHOR"
          echo "Labels: $RAW_LABELS"
          echo "PR Number: $PR_NUM"

          # run release drafter script
          bash .forgejo/release-drafter.sh -m "$COMMIT_MSG" -t "$CURRENT_TAG" -a "$AUTHOR" -l "$RAW_LABELS" -p "$PR_NUM"
          
          NEW_TAG=$(grep "__version__ =" __version__.py | cut -d '"' -f 2)
          echo "final_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Update and Commit Version
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions-user@noreply.codeberg.org"
          git add __version__.py CHANGELOG.md
  
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.validator.outputs.final_tag }} [release-draft]"
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              git push origin main
            else
              #echo "Dry run push:"
              git push --dry-run origin HEAD:${{ github.head_ref }}
            fi
          fi

      - name: Prepare Release Body
        id: body
        run: |
          # Output new header for debugging
          echo "--- Release Body Content ---"
          cat ./header.tmp
      