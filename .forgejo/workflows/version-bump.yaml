name: Determine Version and Update Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/deezer_engine/__version__.py'
      - 'CHANGELOG.md'
      - '.forgejo/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  draft-release:
    # Don't trigger yourself
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[release-draft]'))
    timeout-minutes: 10
    runs-on: py-runner
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PAT }}

      - name: Validate Release Version
        id: validator
        env:
          BEFORE_SHA: "${{ github.event.before }}"
          TARGET_SHA: "${{ github.sha }}"
          AUTHOR_NAME: "${{ github.actor }}"
        run: |
          set -eo pipefail

          # Preview current commit details
          echo "Git Log: $(git log -1)"

          if [[ -z "$AUTHOR_NAME" || "$AUTHOR_NAME" == "***" ]]; then
            echo ">>> No author found. Fetching author via git log."
            AUTHOR=$(git log -1 --pretty=%an)
          else
            AUTHOR="$AUTHOR_NAME"
          fi

          echo "Author: $AUTHOR"

          # run release drafter script (it resolves range/tag directly from git)
          bash .forgejo/release-drafter.sh -a "$AUTHOR" --no-dry-run
          
          NEW_TAG=$(grep "__version__ =" app/deezer_engine/__version__.py | cut -d '"' -f 2)
          echo "final_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Open Version PR
        env:
          FORGEJO_TOKEN: ${{ secrets.REPO_PAT }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          FINAL_TAG: ${{ steps.validator.outputs.final_tag }}
        run: |
          set -eo pipefail

          git config user.name "forgejo-actions"
          git config user.email "actions-user@noreply.codeberg.org"
          BASE_SHA=$(git rev-parse HEAD)
          git add app/deezer_engine/__version__.py CHANGELOG.md

          if ! git diff --cached --quiet; then
            BRANCH_NAME="version-bump"

            # Create or reset the static branch from current HEAD
            git checkout -B "$BRANCH_NAME"
            git commit -m "chore: release ${FINAL_TAG} [release-draft]"
            git push origin "$BRANCH_NAME" --force

            REPO_OWNER="${REPOSITORY%%/*}"
            HEAD_REF="${REPO_OWNER}:${BRANCH_NAME}"

            pr_number_from_response() {
              sed -n 's/.*"number":\([0-9][0-9]*\).*/\1/p' | head -n1
            }

            lookup_pr_by_state() {
              local state="$1"
              local head_ref="$2"
              local lookup_resp lookup_code lookup_body

              lookup_resp=$(curl -sS -w "\n%{http_code}" \
                -H "Authorization: token ${FORGEJO_TOKEN}" \
                "${SERVER_URL}/api/v1/repos/${REPOSITORY}/pulls?state=${state}&head=${head_ref}&base=main&limit=1")

              lookup_code=$(printf '%s\n' "$lookup_resp" | tail -n1)
              lookup_body=$(printf '%s\n' "$lookup_resp" | sed '$d')

              if [[ "$lookup_code" != "200" ]]; then
                echo ""
                return 0
              fi

              printf '%s\n' "$lookup_body" | pr_number_from_response
            }

            lookup_open_pr() {
              lookup_pr_by_state "open" "$1"
            }

            lookup_closed_pr() {
              lookup_pr_by_state "closed" "$1"
            }

            # Check if an open PR already exists for this branch
            EXISTING_PR=$(lookup_open_pr "$HEAD_REF")

            # Compatibility fallback if instance expects bare branch name
            if [[ -z "$EXISTING_PR" ]]; then
              EXISTING_PR=$(lookup_open_pr "$BRANCH_NAME")
            fi

            if [[ -n "$EXISTING_PR" ]]; then
              echo "Updating existing PR #${EXISTING_PR} title."
              curl -fsS -X PATCH \
                -H "Authorization: token ${FORGEJO_TOKEN}" \
                -H "Content-Type: application/json" \
                "${SERVER_URL}/api/v1/repos/${REPOSITORY}/pulls/${EXISTING_PR}" \
                --data-binary "{
                  \"title\": \"chore: release ${FINAL_TAG}\"
                }"
            else
              echo "Opening new PR."
              CREATE_RESP=$(curl -sS -w "\n%{http_code}" -X POST \
                -H "Authorization: token ${FORGEJO_TOKEN}" \
                -H "Content-Type: application/json" \
                "${SERVER_URL}/api/v1/repos/${REPOSITORY}/pulls" \
                --data-binary "{
                  \"title\": \"chore: release ${FINAL_TAG}\",
                  \"body\": \"Automated version bump and changelog update for ${FINAL_TAG}.\",
                  \"head\": \"${BRANCH_NAME}\",
                  \"base\": \"main\"
                }")

              CREATE_CODE=$(printf '%s\n' "$CREATE_RESP" | tail -n1)
              CREATE_BODY=$(printf '%s\n' "$CREATE_RESP" | sed '$d')

              if [[ "$CREATE_CODE" == "201" ]]; then
                echo "Opened PR successfully."
              elif [[ "$CREATE_CODE" == "409" ]]; then
                echo "PR already exists (HTTP 409). Locating existing PR."
                PR_MATCH_SOURCE=""
                EXISTING_PR=$(lookup_open_pr "$HEAD_REF")
                [[ -n "$EXISTING_PR" ]] && PR_MATCH_SOURCE="open:${HEAD_REF}"

                if [[ -z "$EXISTING_PR" ]]; then
                  EXISTING_PR=$(lookup_open_pr "$BRANCH_NAME")
                  [[ -n "$EXISTING_PR" ]] && PR_MATCH_SOURCE="open:${BRANCH_NAME}"
                fi

                if [[ -z "$EXISTING_PR" ]]; then
                  EXISTING_PR=$(lookup_closed_pr "$HEAD_REF")
                  [[ -n "$EXISTING_PR" ]] && PR_MATCH_SOURCE="closed:${HEAD_REF}"
                fi

                if [[ -z "$EXISTING_PR" ]]; then
                  EXISTING_PR=$(lookup_closed_pr "$BRANCH_NAME")
                  [[ -n "$EXISTING_PR" ]] && PR_MATCH_SOURCE="closed:${BRANCH_NAME}"
                fi

                if [[ -z "$EXISTING_PR" ]]; then
                  echo "Failed to resolve existing PR after HTTP 409."
                  echo "$CREATE_BODY"
                  exit 1
                fi

                echo "Resolved PR #${EXISTING_PR} via ${PR_MATCH_SOURCE}."

                curl -fsS -X PATCH \
                  -H "Authorization: token ${FORGEJO_TOKEN}" \
                  -H "Content-Type: application/json" \
                  "${SERVER_URL}/api/v1/repos/${REPOSITORY}/pulls/${EXISTING_PR}" \
                  --data-binary "{\"title\": \"chore: release ${FINAL_TAG}\", \"state\": \"open\"}"
              else
                echo "Failed to open PR (HTTP ${CREATE_CODE})."
                echo "$CREATE_BODY"
                exit 1
              fi
            fi

            DRAFT_TAG="${FINAL_TAG}.b"
            git tag -f "$DRAFT_TAG" "$BASE_SHA"
            git push origin -f "refs/tags/$DRAFT_TAG"
            echo "Moved draft tag $DRAFT_TAG to $BASE_SHA"
          else
            echo "No version changes detected, skipping PR creation."
          fi


