name: Determine Version and Update Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/deezer_engine/__version__.py'
      - 'CHANGELOG.md'
      - '.forgejo/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: string

jobs:
  draft-release:
    # Don't trigger yourself
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[release-draft]'))
    timeout-minutes: 10
    runs-on: py-runner
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_PAT }}

      - name: Validate Release Version
        id: validator
        env:
          BEFORE_SHA: "${{ github.event.before }}"
          TARGET_SHA: "${{ github.sha }}"
          AUTHOR_NAME: "${{ github.actor }}"
        run: |
          set -eo pipefail

          # Preview current commit details
          echo "Git Log: $(git log -1)"

          if [[ -z "$AUTHOR_NAME" || "$AUTHOR_NAME" == "***" ]]; then
            echo ">>> No author found. Fetching author via git log."
            AUTHOR=$(git log -1 --pretty=%an)
          else
            AUTHOR="$AUTHOR_NAME"
          fi

          echo "Author: $AUTHOR"

          # run release drafter script (it resolves range/tag directly from git)
          bash .forgejo/release-drafter.sh -a "$AUTHOR" --no-dry-run
          
          NEW_TAG=$(grep "__version__ =" app/deezer_engine/__version__.py | cut -d '"' -f 2)
          echo "final_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Update and Commit Version
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions-user@noreply.codeberg.org"
          git add app/deezer_engine/__version__.py CHANGELOG.md
  
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.validator.outputs.final_tag }} [release-draft]"
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              git push origin main
            else
              # Determine current branch name for dry run
              BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
              echo "Dry run push:"
              git push --dry-run origin HEAD:$BRANCH_NAME
            fi
          fi

