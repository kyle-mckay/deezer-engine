name: (LEGACY) Build, Test, and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Manual tag name'
        default: 'latest'
        type: string

jobs:
  test_and_push:
    name: Build, Test, and Push
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          set-safe-directory: 'true'

      - name: Install Docker CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io curl jq

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            codeberg.org/${{ github.repository }}
            kylemmkay/deezer-engine
          tags: |
            # Release-only tags
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            
            # Manual/Development tags
            type=sha,prefix=beta-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=beta,enable=${{ github.event_name == 'workflow_dispatch' }}
            
            # Pull Request tags (internal only)
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Build the image locally
      - name: Build local image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: deezer-engine:test

      - name: Verify Container Execution
        run: |
          echo "Cleaning up any old test containers..."
          docker rm -f engine-test 2>/dev/null || true
          
          echo "Preparing test environment in dir: $(pwd)..."
          mkdir -p ./test_data
          echo "playlists:" > ./test_data/strategies.yml

          if [[ -f "./test_data/strategies.yml" ]]; then
            echo "File created successfully at ./test_data/strategies.yml"
          else
            echo "File failed to create..."
            exit 1
          fi

          echo "Creating Container..." # but dont start yet
          docker create --name engine-test \
            -e DEEZER_PRINT_BANNER=true \
            -e DEEZER_LOG_LEVEL="DEBUG" \
            deezer-engine:test run

          # Copy strat file to container then run
          docker cp ./test_data/strategies.yml engine-test:/app/data/strategies.yml
          docker start engine-test

          sleep 10
          
          LOGS=$(docker logs engine-test 2>&1)
          echo "--- Container Logs ---"
          echo "$LOGS"
          echo "----------------------"

          # 1. Check for the Banner
          if [[ "$LOGS" != *"Running Deezer-Engine"* ]]; then
            echo "❌ Banner NOT detected."
            exit 1
          else
            echo "✅ Banner detected"
          fi

          # 2. Check for Config Warning 
          if ! printf '%s\n' "$LOGS" | grep -Eq "\[WARNING\]( \[[^]]+\])? - Strategies file" \
            && ! printf '%s\n' "$LOGS" | grep -Eq "\[DEBUG\]( \[[^]]+\])? - --- Processing Strategy"; then
              echo "Error: Required log patterns not found."
              exit 1
          else
            echo "✅ Strategy file identified"
          fi

          # 3. Check for Engine Logic 
          if ! printf '%s\n' "$LOGS" | grep -Eq "\[ERROR\]( \[[^]]+\])? - ARL token is missing"; then
            echo "❌ Engine check failed: Missing ARL error not found."
            exit 1
          else
            echo "✅ Config loader detected 'invalid' config"
          fi

          echo "✅ All verification checks passed!"
          
          # Clean up
          docker rm -f engine-test

      # 3. Log in (proceed if not PR)
      - name: Log in to Registries
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.REPO_PAT }}" | docker login codeberg.org -u ${{ github.actor }} --password-stdin
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Get Repo Description from Codeberg
        if: |
          github.event_name == 'release' && 
          github.event.release.target_commitish == 'main'
        id: repo_data
        run: |
          DESC=$(curl -s "https://codeberg.org/api/v1/repos/${{ github.repository }}" | jq -r '.description')
          echo "description=$DESC" >> $GITHUB_OUTPUT

      - name: Update Docker Hub Description
        if: |
          github.event_name == 'release' && 
          github.event.release.target_commitish == 'main'
        uses: https://github.com/peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository }}
          short-description: ${{ steps.repo_data.outputs.description }}
          readme-filepath: ./README.md